<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Abastecimento - SysFaturaWB</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .form-container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 2.5rem;
            width: 100%;
            max-width: 600px;
            margin: 15px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-header i {
            font-size: 3rem;
            color: #0d6efd;
        }

        .form-header h2 {
            font-weight: 700;
            color: #2c3e50;
            margin-top: 10px;
        }

        .input-group-text {
            background-color: #f8f9fa;
            border-right: none;
            color: #6c757d;
        }

        .form-control, .form-select {
            border-left: none;
            padding: 0.75rem;
        }

        .form-control:focus, .form-select:focus {
            box-shadow: none;
            border-color: #dee2e6;
        }

        .input-group:focus-within {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
            border-radius: 0.375rem;
        }

        .btn-submit {
            padding: 0.8rem;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
        }

        /* Ajustes Mobile */
        @media (max-width: 576px) {
            .form-container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="form-header">
        <i class="bi bi-fuel-pump-fill"></i>
        <h2>Registrar Abastecimento</h2>
        <p class="text-muted">Preencha os dados conforme o comprovante</p>
    </div>

    <form action="/salvar-abastecimento" method="POST">
        <div class="row g-3">
            
            <div class="col-12">
                <label class="form-label fw-bold">Veículo</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-car-front"></i></span>
                    <select class="form-select" name="cd_veiculo" required>
                        <option value="" selected disabled>Selecione o veículo...</option>
                        <option value="1">Renault Duster - ABC-1234</option>
                        <option value="2">Fiat Toro - XYZ-5678</option>
                        <option value="3">Honda Civic - KKK-9999</option>
                    </select>
                </div>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-bold">Data</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
                    <input type="date" class="form-control" name="dt_abastecimento" value="2026-04-08" required>
                </div>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-bold">KM Atual</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-speedometer"></i></span>
                    <input type="number" step="0.01" class="form-control" name="km_atual" placeholder="0.00" required>
                </div>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-bold">Litros</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-droplet"></i></span>
                    <input type="number" step="0.01" class="form-control" name="litros" placeholder="0.00" required>
                </div>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-bold">Cód. Registro</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-hash"></i></span>
                    <input type="text" class="form-control" name="cd_abastecimento" placeholder="Automático" readonly>
                </div>
            </div>

            <div class="col-12 mt-4">
                <div class="row g-2">
                    <div class="col-6">
                        <button type="reset" class="btn btn-outline-secondary w-100 btn-submit">Limpar</button>
                    </div>
                    <div class="col-6">
                        <button type="submit" class="btn btn-primary w-100 btn-submit">
                            <i class="bi bi-check-lg me-2"></i>Salvar
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
