<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/html">
 <head th:replace="~{fragmento :: head('Cadastro de Veículos') }">
<meta charset="UTF-8">
</head>
<body>
 <!-- Nav Bar -->
    <nav th:replace="~{navfragment:: nav }"></nav>
	<div class="container-fluid">
		<div class="card mt-1" th:if="${operacao=='C'}">
			<div class="card-header">Manutenções</div>
			<div class="card-body">
				<h5 class="card-title">Cadastro</h5>
				<p class="card-text">
				<div class="container">
					<form method="post" action="/manutencao/adicionar">
						<label class="label-form" for="cdManutencao">Código</label>
						<input type="text"  id="cdManutencao" name="cdManutencao" th:value="${manutencao.cdManutencao}" th:field="*{manutencao.cdManutencao}"  class="form-control" readonly>
						<label class="label-form" for="veiculo">Vecículo</label>
						<select class="form-select mt-3" id="veiculo" name="veiculo" aria-label="Default select example" required>
							<option selected>Selecione um Veículo</option>
							<option th:each="veiculos : ${veiculos}"  th:text="${veiculos.fabricante}+' - '+${veiculos.modelo}+' - '+ ${veiculos.placa}" th:value="${veiculos.cdVeiculo}">One</option>
						</select>
                        <select class="form-select mt-3" id="fornecedor" name="fornecedor" aria-label="Default select example" required>
                            <option selected>Selecione um Fornecedor</option>
                            <option th:each="fornecedor : ${fornecedores}"  th:text="${fornecedor.nmFornecedor}" th:value="${fornecedor.cdFornecedor}">One</option>
                        </select>
						<label class="label-form" for="km">Manutenção KM</label>
						<input type="number"  id="km" name="km" th:value="${manutencao.km}" th:field="*{manutencao.km}"  class="form-control mt-3" required>
						<a th:href="@{'/'}" class="btn btn-primary gray mt-3">
							<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house-door-fill" viewBox="0 0 16 16">
								<path d="M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5"/>
							</svg>&nbsp;Home
						</a>
						<button type="submit" class="btn btn-primary mt-3">
							<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-square-fill" viewBox="0 0 16 16">
								<path d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm6.5 4.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3a.5.5 0 0 1 1 0"/>
							</svg>&nbsp;Adicionar
						</button>
						<a href="/manutencao/pesquisar" class="btn btn-primary mt-3 red">
							<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
								<path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
							</svg>&nbsp;Pesquisar
						</a>
					</form>
				</div>
			</div>
		</div>
		<!-- iNICIO DO CARD TABELA -->
		<div class="card mt-1" th:if="${operacao=='P'}">
			<div class="card-header"></div>
			<div class="card-body">
				<h5 class="card-title">Manutenções Cadastradas</h5>
				<p class="card-text">
				<div class="container">
				<div class="alert alert-primary mt-3 mb-3" role="alert" th:if="${msg!=null}" th:text="${msg}">
					A simple primary alert—check it out!
				</div>
				<table class="table table-striped table-hover" id="fornecedores">
					<thead>
                        <th scope="col">ID</th>
						<th scope="col">Veiculo</th>
						<th scope="col">Fornecedor</th>
						<th scope="col">KM</th>
						<th scope="col">Realizado</th>
						<th scope="col">Data de Realização</th>
					</thead>
					<tbody>
					<tr th:each="m : ${manutencoes}">
						<td th:text="${m.cdManutencao}"></td>
						<td th:text="${m.veiculo.fabricante} + ' - ' + ${m.veiculo.modelo}+ ' - ' + ${m.veiculo.cor} + ' - ' + ${m.veiculo.placa}"></td>
						<td th:text="${m.km}"></td>
						<td th:text="${m.snRealizado}"></td>
						<td th:text="${m.dtRealizacao}"></td>
						<td>
							<a th:href="@{'/manutencao/excluir/'}+${m.cdManutencao}" class="btn btn-primary">
								<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16">
									<path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
									<path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
								</svg>
							</a>
							<a th:href="@{'/manutencao/excluir/'}+${m.cdManutencao}" class="btn btn-primary red">
								<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash3-fill" viewBox="0 0 16 16">
									<path d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5"/>
								</svg>
							</a>
							<a th:href="@{'/item/cadastro/'+${m.cdManutencao}+'/'+${m.veiculo.cdVeiculo}}" class="btn btn-primary gray">
								<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-square-fill" viewBox="0 0 16 16">
									<path d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm6.5 4.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3a.5.5 0 0 1 1 0"/>
								</svg>
							</a>
						</td>
					</tr>
					</tbody>
				</table>
				<a th:href="@{'/'}" class="btn btn-primary gray">
					<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house-door-fill" viewBox="0 0 16 16">
						<path d="M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5"/>
					</svg>Home
				</a>
				</div>
			</div>
		</div>
		<!-- FIM DO CARD TABELA -->
	</div>
</body>
<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"
integrity="sha384-U1DAWAznBHeqEIlVSCgzq+c9gqGAJn5c/t99JyeKa9xxaYpSvHU5awsuZVVFIhvj"
crossorigin="anonymous">
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

feather.replace()

<script type="text/javascript" src="materialize/js/materialize.min.js"></script>

 $(document).ready(function() {
   M.updateTextFields();
});

 <!-- Paginação -->
 <script src="//code.jquery.com/jquery-3.2.1.min.js"></script>
 <script src="//cdn.datatables.net/1.10.15/js/jquery.dataTables.min.js"></script>
 <script>
	 $(document).ready(function(){
         $('#fornecedores').DataTable({
               "language": {
                   "lengthMenu": "Mostrando _MENU_ registros por página",
                   "zeroRecords": "Nada encontrado",
                   "info": "Mostrando página _PAGE_ de _PAGES_",
                   "infoEmpty": "Nenhum registro disponível",
                   "infoFiltered": "(filtrado de _MAX_ registros no total)"

               },
               columnDefs: [ {
                   targets: [ 0 ],
                   orderData: [ 0, 3]
               }]

           });
     });
 </script>
 </body>
</html>
